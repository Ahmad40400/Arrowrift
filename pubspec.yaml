name: arrow_escape
description: "Arrow Escape Puzzle Game"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: "^3.13.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  flutter_animate: ^4.2.0
  confetti: ^0.7.0
  audioplayers: ^6.0.0
  shared_preferences: ^2.5.3 # UPDATED: Purana version buggy tha

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/sounds/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
